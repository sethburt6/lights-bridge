name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "$FILE" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($FILE)" >&2
            exit 1
          fi
      - name: Build
        run: scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Uploads LightsBridge.dmg. The page text is the CHANGELOG section for this version
        # followed by docs/RELEASE_NOTES.md (see scripts/release-notes.sh).
        run: |
          scripts/release-notes.sh "$(cat VERSION)" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/LightsBridge.dmg \
            --title "Lights Bridge $(cat VERSION)" \
            --notes-file notes.md
